<!DOCTYPE html>
<!-- MODIFIED: Different shades of gray (equal R, G, B values) with padded, rounded boxes. -->
<html>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
h2 { padding: 12px 16px; border-radius: 8px; border: 1px solid #999; }
</style>
<body>

<h1>Shades of gray</h1>

<p>By using equal values for red, green, and blue, you will get different shades of gray:</p>

<h2 style="background-color:rgb(30, 30, 30);">rgb(30, 30, 30)</h2>
<h2 style="background-color:rgb(70, 70, 70);">rgb(70, 70, 70)</h2>
<h2 style="background-color:rgb(110, 110, 110);">rgb(110, 110, 110)</h2>
<h2 style="background-color:rgb(170, 170, 170);">rgb(170, 170, 170)</h2>
<h2 style="background-color:rgb(200, 200, 200);">rgb(200, 200, 200)</h2>
<h2 style="background-color:rgb(250, 250, 250);">rgb(250, 250, 250)</h2>

</body>
</html>
