<!DOCTYPE html>
<!-- MODIFIED: RGBA example now uses indigo (63, 81, 181) at the same six transparency levels. -->
<html>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
h2 { padding: 12px 16px; border-radius: 8px; }
</style>
<body>

<h1>Make transparent colors with RGBA</h1>

<h2 style="background-color:rgba(63, 81, 181, 0);">rgba(63, 81, 181, 0)</h2>
<h2 style="background-color:rgba(63, 81, 181, 0.2);">rgba(63, 81, 181, 0.2)</h2>
<h2 style="background-color:rgba(63, 81, 181, 0.4);">rgba(63, 81, 181, 0.4)</h2>
<h2 style="background-color:rgba(63, 81, 181, 0.6);">rgba(63, 81, 181, 0.6)</h2>
<h2 style="background-color:rgba(63, 81, 181, 0.8);">rgba(63, 81, 181, 0.8)</h2>
<h2 style="background-color:rgba(63, 81, 181, 1);">rgba(63, 81, 181, 1)</h2>

</body>
</html>
