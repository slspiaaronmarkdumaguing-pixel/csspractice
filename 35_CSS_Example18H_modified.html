<!DOCTYPE html>
<!-- MODIFIED: New HEX gray shades with rounded, padded boxes. -->
<html>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
h2 { padding: 12px 16px; border-radius: 8px; border: 1px solid #999; }
</style>
<body>

<h1>Shades of gray</h1>

<p>By using equal values for red, green, and blue, you will get different shades of gray:</p>

<h2 style="background-color:#1e1e1e;">#1e1e1e</h2>
<h2 style="background-color:#555555;">#555555</h2>
<h2 style="background-color:#808080;">#808080</h2>
<h2 style="background-color:#bdbdbd;">#bdbdbd</h2>
<h2 style="background-color:#e0e0e0;">#e0e0e0</h2>
<h2 style="background-color:#eeeeee;">#eeeeee</h2>

</body>
</html>
