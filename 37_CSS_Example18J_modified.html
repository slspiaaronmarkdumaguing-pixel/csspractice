<!DOCTYPE html>
<!-- MODIFIED: HSL examples use new hues (pink, blue, lime, violet, yellow, teal) with rounded headings. -->
<html>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
h2 { padding: 12px 16px; border-radius: 8px; }
</style>
<body>

<h1>Specify colors using HSL values</h1>

<h2 style="background-color:hsl(330, 80%, 55%);">hsl(330, 80%, 55%)</h2>
<h2 style="background-color:hsl(200, 90%, 45%);">hsl(200, 90%, 45%)</h2>
<h2 style="background-color:hsl(90, 60%, 50%);">hsl(90, 60%, 50%)</h2>
<h2 style="background-color:hsl(280, 70%, 70%);">hsl(280, 70%, 70%)</h2>
<h2 style="background-color:hsl(50, 100%, 50%);">hsl(50, 100%, 50%)</h2>
<h2 style="background-color:hsl(170, 60%, 40%);">hsl(170, 60%, 40%)</h2>

</body>
</html>
