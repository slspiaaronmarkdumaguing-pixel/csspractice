<!DOCTYPE html>
<!-- MODIFIED: Saturation demo changed from red (hue 0) to blue (hue 210). -->
<html>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
h2 { padding: 12px 16px; border-radius: 8px; }
</style>
<body>

<h1>HSL Saturation</h1>

<p>The second parameter of hsl() defines the saturation. Less saturation mean less color. 0% is
completely gray:</p>

<h2 style="background-color:hsl(210, 100%, 50%);">hsl(210, 100%, 50%)</h2>
<h2 style="background-color:hsl(210, 80%, 50%);">hsl(210, 80%, 50%)</h2>
<h2 style="background-color:hsl(210, 60%, 50%);">hsl(210, 60%, 50%)</h2>
<h2 style="background-color:hsl(210, 40%, 50%);">hsl(210, 40%, 50%)</h2>
<h2 style="background-color:hsl(210, 20%, 50%);">hsl(210, 20%, 50%)</h2>
<h2 style="background-color:hsl(210, 0%, 50%);">hsl(210, 0%, 50%)</h2>

</body>
</html>
