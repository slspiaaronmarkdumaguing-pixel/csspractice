<!DOCTYPE html>
<!-- MODIFIED: Lightness demo changed from red (hue 0) to green (hue 120). -->
<html>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
h2 { padding: 12px 16px; border-radius: 8px; border: 1px solid #555; }
</style>
<body>

<h1>HSL Lightness</h1>

<p>The third parameter of hsl() defines the lightness. 0% means black, and 100% means white:</p>

<h2 style="background-color:hsl(120, 100%, 0%);">hsl(120, 100%, 0%)</h2>
<h2 style="background-color:hsl(120, 100%, 25%);">hsl(120, 100%, 25%)</h2>
<h2 style="background-color:hsl(120, 100%, 50%);">hsl(120, 100%, 50%)</h2>
<h2 style="background-color:hsl(120, 100%, 75%);">hsl(120, 100%, 75%)</h2>
<h2 style="background-color:hsl(120, 100%, 90%);">hsl(120, 100%, 90%)</h2>
<h2 style="background-color:hsl(120, 100%, 100%);">hsl(120, 100%, 100%)</h2>

</body>
</html>
