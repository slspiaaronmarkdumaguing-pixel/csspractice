<!DOCTYPE html>
<!-- MODIFIED: Different lightness steps for the grays (10%, 30%, 50%, 75%, 90%, 97%). -->
<html>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
h2 { padding: 12px 16px; border-radius: 8px; border: 1px solid #888; }
</style>
<body>

<h1>Shades of gray</h1>

<p>With HSL, shades of gray are made by setting the saturation to 0%, and adjusting the lightness from
0% to 100%:</p>

<h2 style="background-color:hsl(0, 0%, 10%);">hsl(0, 0%, 10%)</h2>
<h2 style="background-color:hsl(0, 0%, 30%);">hsl(0, 0%, 30%)</h2>
<h2 style="background-color:hsl(0, 0%, 50%);">hsl(0, 0%, 50%)</h2>
<h2 style="background-color:hsl(0, 0%, 75%);">hsl(0, 0%, 75%)</h2>
<h2 style="background-color:hsl(0, 0%, 90%);">hsl(0, 0%, 90%)</h2>
<h2 style="background-color:hsl(0, 0%, 97%);">hsl(0, 0%, 97%)</h2>

</body>
</html>
