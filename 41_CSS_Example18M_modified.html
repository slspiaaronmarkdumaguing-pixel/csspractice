<!DOCTYPE html>
<!-- MODIFIED: HSLA transparency demo changed from orange-red to purple (hsla 280, 60%, 50%). -->
<html>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
h2 { padding: 12px 16px; border-radius: 8px; }
</style>
<body>

<h1>Make transparent colors with HSLA</h1>

<h2 style="background-color:hsla(280, 60%, 50%, 0);">hsla(280, 60%, 50%, 0)</h2>
<h2 style="background-color:hsla(280, 60%, 50%, 0.2);">hsla(280, 60%, 50%, 0.2)</h2>
<h2 style="background-color:hsla(280, 60%, 50%, 0.4);">hsla(280, 60%, 50%, 0.4)</h2>
<h2 style="background-color:hsla(280, 60%, 50%, 0.6);">hsla(280, 60%, 50%, 0.6)</h2>
<h2 style="background-color:hsla(280, 60%, 50%, 0.8);">hsla(280, 60%, 50%, 0.8)</h2>
<h2 style="background-color:hsla(280, 60%, 50%, 1);">hsla(280, 60%, 50%, 1)</h2>

</body>
</html>
