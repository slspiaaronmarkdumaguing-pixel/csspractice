<!DOCTYPE html>
<!-- MODIFIED: Different per-side widths (10/30, 30/10, 12/30/6/50) in a burnt-orange color; comments updated. -->
<html>
<head>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
</style>
<style>
p.one {
  border-style: solid;
  border-width: 10px 30px; /* 10px top and bottom, 30px on the sides */
}

p.two {
  border-style: solid;
  border-width: 30px 10px; /* 30px top and bottom, 10px on the sides */
}

p.three {
 border-style: solid;
 border-width: 12px 30px 6px 50px; /* 12px top, 30px right, 6px bottom and 50px left */
}
p.one, p.two, p.three { border-color: #d84315; }
</style>
</head>
<body>

<h2>The border-width Property</h2>
<p>The border-width property can have from one to four values (for the top border, right border, bottom
border, and the left border):</p>

<p class="one">Some text.</p>
<p class="two">Some text.</p>
<p class="three">Some text.</p>

</body>
</html>
