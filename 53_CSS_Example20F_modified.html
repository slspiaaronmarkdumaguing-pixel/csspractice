<!DOCTYPE html>
<!-- MODIFIED: Shorthand with two values now gives double top/bottom and dashed left/right, in teal. -->
<html>
<head>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
</style>
<style>
p {
  border-style: double dashed;
}
p { border-width: 5px; border-color: #00897b; padding: 8px; }
</style>
</head>
<body>

<h2>Individual Border Sides</h2>
<p>double and dashed border styles.</p>

</body>
</html>
