<!DOCTYPE html>
<!-- MODIFIED: Smaller top/bottom margins (40px), larger left margin (200px), green box with thick border (text updated). -->
<html>
<head>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
</style>
<style>
div {
  border: 3px solid #2e7d32;
  margin-top: 40px;
  margin-bottom: 40px;
  margin-right: 60px;
  margin-left: 200px;
  background-color: #c8e6c9;
}
</style>
</head>
<body>

<h2>Using individual margin properties</h2>

<div>This div element has a top margin of 40px, a right margin of 60px, a bottom margin of 40px, and
a left margin of 200px.</div>

</body>
</html>
