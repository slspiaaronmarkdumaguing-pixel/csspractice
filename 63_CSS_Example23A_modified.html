<!DOCTYPE html>
<!-- MODIFIED: Headings re-aligned (h1 right, h2 center, h3 left; labels updated) and colored. -->
<html>
<head>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
</style>
<style>
h1 {
  text-align: right;
}

h2 {
  text-align: center;
}

h3 {
  text-align: left;
}
h1 { color: #1a237e; }
h2 { color: #b71c1c; }
h3 { color: #1b5e20; }
</style>
</head>
<body>

<h1>Heading 1 (right)</h1>
<h2>Heading 2 (center)</h2>
<h3>Heading 3 (left)</h3>

<p>The three headings above are aligned center, left and right.</p>

</body>
</html>
