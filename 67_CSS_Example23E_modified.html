<!DOCTYPE html>
<!-- MODIFIED: Bigger indent (80px), justified serif text with a brown left rule. -->
<html>
<head>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
</style>
<style>
p {
  text-indent: 80px;
}
p { line-height: 1.8; font-family: Georgia, serif; text-align: justify; color: #37474f; border-left: 4px solid #8d6e63; padding-left: 10px; }
</style>
</head>
<body>

<h1>Using text-indent</h1>

<p>In my younger and more vulnerable years my father gave me some advice that I've been turning over
in my mind ever since. 'Whenever you feel like criticizing anyone,' he told me, 'just remember that all the
people in this world haven't had the advantages that you've had.'</p>

</body>
</html>
