<!DOCTYPE html>
<!-- MODIFIED: Wider letter spacing (10px) and a different negative spacing (-3px), with colored headings. -->
<html>
<head>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
</style>
<style>
h2 {
  letter-spacing: 10px;
}

h3 {
  letter-spacing: -3px;
}
h2 { color: #6a1b9a; }
h3 { color: #00838f; font-size: 30px; }
</style>
</head>
<body>

<h1>Using letter-spacing</h1>

<h2>This is heading 1</h2>
<h3>This is heading 2</h3>

</body>
</html>
