<!DOCTYPE html>
<!-- MODIFIED: Fonts swapped (Georgia, Verdana, Courier New), larger text; descriptions updated. -->
<html>
<head>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
</style>
<style>
.p1 {
  font-family: Georgia, "Times New Roman", serif;
}

.p2 {
    font-family: Verdana, Geneva, sans-serif;
}

.p3 {
  font-family: "Courier New", Courier, monospace;
}
p { font-size: 22px; }
</style>
</head>
<body>

<h1>CSS font-family</h1>
<p class="p1">This is a paragraph, shown in the Georgia font.</p>
<p class="p2">This is a paragraph, shown in the Verdana font.</p>
<p class="p3">This is a paragraph, shown in the Courier New font.</p>

</body>
</html>
