<!DOCTYPE html>
<!-- MODIFIED: Each font-style paragraph gets a different color, size and tinted background. -->
<html>
<head>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
</style>
<style>
p.normal {
  font-style: normal;
}

p.italic {
  font-style: italic;
}

p.oblique {
  font-style: oblique;
}
p.normal { color: #37474f; font-size: 20px; background-color: #eceff1; }
p.italic { color: #ad1457; font-size: 22px; background-color: #fce4ec; }
p.oblique { color: #00695c; font-size: 24px; background-color: #e0f2f1; }
</style>
</head>
<body>

<h1>The font-style property</h1>

<p class="normal">This is a paragraph in normal style.</p>
<p class="italic">This is a paragraph in italic style.</p>
<p class="oblique">This is a paragraph in oblique style.</p>

</body>
</html>
