<!DOCTYPE html>
<!-- MODIFIED: Heavier weights (bold becomes 800) and a different color and size per weight. -->
<html>
<head>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
</style>
<style>
p.normal {
  font-weight: normal;
}

p.light {
  font-weight: lighter;
}

p.thick {
 font-weight: 800;
}

p.thicker {
  font-weight: 900;
}
p.normal { color: #37474f; font-size: 20px; }
p.light { color: #78909c; font-size: 22px; }
p.thick { color: #c62828; font-size: 24px; }
p.thicker { color: #4a148c; font-size: 26px; }
</style>
</head>
<body>

<h1>The font-weight property</h1>

<p class="normal">This is a paragraph.</p>
<p class="light">This is a paragraph.</p>
<p class="thick">This is a paragraph.</p>
<p class="thicker">This is a paragraph.</p>

</body>
</html>
