<!DOCTYPE html>
<!-- MODIFIED: Larger pixel sizes (56px, 38px, 20px) with colored headings. -->
<html>
<head>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
</style>
<style>
h1 {
  font-size: 56px;
}

h2 {
  font-size: 38px;
}

p {
  font-size: 20px;
}
h1 { color: #283593; }
h2 { color: #00838f; }
</style>
</head>
<body>

<h1>This is heading 1</h1>
<h2>This is heading 2</h2>
<p>This is a paragraph.</p>
<p>This is another paragraph.</p>

</body>
</html>
