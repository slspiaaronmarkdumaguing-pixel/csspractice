<!DOCTYPE html>
<!-- MODIFIED: Root font size raised to 18px; rem sizes changed to 3rem, 2rem and 1.2rem (comments updated). -->
<html>
<head>
<style>
/* MODIFIED base theme: placed first, so the example's own rules still win */
body {
 font-family: "Trebuchet MS", Verdana, sans-serif;
 line-height: 1.5;
 padding: 14px 22px;
 background-color: #fff3e0;
 color: #2d3142;
 border-top: 8px solid #ef8354;
}
</style>
<style>
html {
  font-size: 18px; /* Sets the root font size */
}

h1 {
  font-size: 3rem; /* 3 * 18 = 54px */
}

h2 {
  font-size: 2rem; /* 2 * 18 = 36px */
}

p {
  font-size: 1.2rem; /* 1.2 * 18 = 21.6px */
}
h1 { color: #283593; }
h2 { color: #00838f; }
</style>
</head>
<body>

<h1>This is heading 1</h1>
<h2>This is heading 2</h2>
<p>This is a paragraph.</p>
<p>Specifying the font-size in rem allows all major browsers to resize the text.</p>

</body>
</html>
